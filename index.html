<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>漫长沉默</title>
<meta name="description" content="从深空勘测船“苍白探寻者”的驾驶舱出发，探索一个程序生成的星系。扫描世界、漫步你的飞船，追随共鸣器的指引。" />
<meta name="author" content="Anshu Chimala" />
<link rel="canonical" href="https://longsilence.anshu.dev/" />

<!-- icons -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- 富媒体分享卡片。图片是运行中的游戏真实截取的一帧（tools/splash.mjs），
     而非仿制的宣传海报。必须使用绝对 URL：爬虫不会解析相对路径。 -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="漫长沉默" />
<meta property="og:title" content="漫长沉默" />
<meta property="og:description" content="从深空勘测船“苍白探寻者”的驾驶舱出发，探索一个程序生成的星系。扫描世界、漫步你的飞船，追随共鸣器的指引。" />
<meta property="og:url" content="https://longsilence.anshu.dev/" />
<meta property="og:image" content="https://longsilence.anshu.dev/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="一艘勘测船的驾驶舱，仪表亮着，透过座舱盖望向外面的蓝色星球，晨昏线尽收眼底。" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="漫长沉默" />
<meta name="twitter:description" content="从深空勘测船“苍白探寻者”的驾驶舱出发，探索一个程序生成的星系。扫描世界、漫步你的飞船，追随共鸣器的指引。" />
<meta name="twitter:image" content="https://longsilence.anshu.dev/og.jpg" />
<meta name="twitter:image:alt" content="一艘勘测船的驾驶舱，仪表亮着，透过座舱盖望向外面的蓝色星球，晨昏线尽收眼底。" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- ====================== BOOT ====================== -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg viewBox="0 0 120 120" width="110" height="110">
          <circle cx="60" cy="60" r="46" class="bm-ring"/>
          <circle cx="60" cy="60" r="34" class="bm-ring bm-ring2"/>
          <circle cx="60" cy="60" r="4"  class="bm-dot"/>
          <path d="M60 4 L60 18 M60 102 L60 116 M4 60 L18 60 M102 60 L116 60" class="bm-tick"/>
        </svg>
      </div>
      <h1 class="boot-title">漫长沉默</h1>
      <div class="boot-sub">深空勘测船 &middot; <span class="accent">苍白探寻者</span></div>
      <div class="boot-bar"><i id="bootFill"></i></div>
      <div class="boot-status" id="bootStatus">正在初始化</div>
      <button id="bootStart" class="boot-start" hidden>苏醒</button>
      <div class="boot-legal">需要 WebGL2 &middot; 建议佩戴耳机</div>
    </div>
  </div>

  <!-- ====================== 世界内覆盖层 ====================== -->
  <!-- 仪表都位于仪表盘上。这一层只承载存在于乘员脑中的东西：
       他们正在看什么、刚刚被告知什么，以及他们够得着什么。 -->
  <div id="hud" class="hidden">

    <!-- 瞄准准星，仅驾驶员可见 -->
    <div id="reticle" class="hidden">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="21" class="r-ring"/>
        <path d="M60 30 L60 38 M60 82 L60 90 M30 60 L38 60 M82 60 L90 60" class="r-tick"/>
        <circle cx="60" cy="60" r="1.4" class="r-dot"/>
        <path id="rArc" d="" class="r-arc"/>
      </svg>
    </div>

    <!-- 投影在座舱盖上的接触标记 -->
    <div id="markers"></div>

    <!-- 消息日志 -->
    <div id="log"></div>

    <!-- 提示紧贴字幕上方，处于同一个堆栈中，锚定在字幕原本独自锚定的位置。
         两者过去都使用固定百分比的绝对定位，而字幕高度取决于对白行数——
         因此任何固定的提示百分比都是猜测，在 945px 高的屏幕上实测重叠了 21px。
         将它们堆叠起来，提示便会跟随字幕的真实高度。
         .hidden 是 display:none，因此无事可交互时提示会从列中折叠消失，
         字幕恰好落回先前的位置，即那个为避开主显示而选的 4%。 -->
    <div id="narrStack">
      <!-- 交互提示 -->
      <div id="prompt" class="hidden">
        <b id="promptKey">E</b><span id="promptLabel"></span><em id="promptHint"></em>
      </div>

      <!-- 叙事字幕 -->
      <div id="narr"><div id="narrText"></div></div>
    </div>

    <!-- 情境化操作 -->
    <div id="hints"></div>

    <!-- 跃迁横幅 -->
    <div id="foldOverlay"><div class="fo-t">跃迁</div><div class="fo-s" id="foldSub"></div></div>

    <!-- 损伤 / 警报暗角在后处理中处理；这里是音频提示文字 -->
    <div id="alert" class="hidden"></div>
  </div>

  <!-- ====================== 档案 ====================== -->
  <div id="codex" class="panel hidden">
    <div class="p-head"><h2>档案</h2><button class="p-close" data-close="codex">✕</button></div>
    <div class="p-body codex-body">
      <div class="codex-nav" id="codexNav"></div>
      <div class="codex-main" id="codexMain"></div>
    </div>
  </div>

  <!-- ====================== 星图 ====================== -->
  <div id="starmap" class="panel hidden">
    <div class="p-head"><h2>星系制图</h2><button class="p-close" data-close="starmap">✕</button></div>
    <div class="p-body map-body">
      <canvas id="mapCanvas"></canvas>
      <div class="map-side" id="mapSide"></div>
    </div>
  </div>

  <!-- ====================== 触屏 ====================== -->
  <div id="touchUI" class="hidden">
    <div id="stickL" class="stick"><i></i></div>
    <div id="stickR" class="stick"><i></i></div>
    <div id="touchBtns">
      <button class="tb" data-act="use">使用</button>
      <button class="tb" data-act="boost">奔跑</button>
      <button class="tb" data-act="scan">扫描</button>
      <button class="tb" data-act="auto">自动</button>
      <button class="tb" data-act="fold">跃迁</button>
    </div>
    <div id="touchThr">
      <button class="tt" data-act="thrUp">+</button>
      <button class="tt" data-act="thrDn">−</button>
    </div>
  </div>

  <div id="perf"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
